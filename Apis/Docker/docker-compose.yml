version: '3.9'

services:
  seq:
    image: datalust/seq:latest
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "5341:80"
    volumes:
      - ./data/seq-data:/usr/share/seq/data
    networks:
      - flow-network


